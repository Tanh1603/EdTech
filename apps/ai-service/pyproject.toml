[project]
name = "ai-service"
version = "0.1.0"
description = "Internal AI orchestration, RAG, and worker service for EdTech"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.136.1",
    "grpcio>=1.76.0",
    "grpcio-tools>=1.76.0",
    "groq>=1.2.0",
    "ollama>=0.6.2",
    "protobuf>=6.33.0",
    "pydantic-settings>=2.12.0",
    "uvicorn>=0.47.0",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "redis>=7.4.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["src/contracts/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
